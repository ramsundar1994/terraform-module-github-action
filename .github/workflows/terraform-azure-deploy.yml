name: Terraform Azure Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'nonprod'
        type: choice
        options:
          - nonprod
          - prod
      plan_only:
        description: 'Only run terraform plan (dry run)'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: .
        run: |
          terraform init -backend-config=environments/backend-${{ github.event.inputs.environment }}.conf

      - name: Terraform Validate
        working-directory: .
        run: |
          terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0


      - name: Terraform Init
        working-directory: .
        run: |
          terraform init -backend-config=environments/backend-${{ github.event.inputs.environment }}.conf

      - name: Terraform Plan
        working-directory: .
        env:
          # Choose the appropriate VM password secret for the selected environment.
          TF_VAR_vm_admin_password: ${{ github.event.inputs.environment == 'prod' && secrets.VM_ADMIN_PASSWORD_PROD || secrets.VM_ADMIN_PASSWORD_NONPROD }}
        run: |
          terraform plan -var-file=vars/${{ github.event.inputs.environment }}.tfvars -out=plan-${{ github.event.inputs.environment }}.tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: plan-${{ github.event.inputs.environment }}.tfplan

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    env:
      ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.plan_only == 'false' }}
    # Use GitHub environment protection for production approvals.
    # Configure the 'production' environment in repository settings
    # with required reviewers or deployment approvals.
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || 'nonprod' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0


      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: .

      - name: Terraform Apply
        working-directory: .
        env:
          TF_VAR_vm_admin_password: ${{ github.event.inputs.environment == 'prod' && secrets.VM_ADMIN_PASSWORD_PROD || secrets.VM_ADMIN_PASSWORD_NONPROD }}
        run: |
          terraform apply -auto-approve plan-${{ github.event.inputs.environment }}.tfplan
